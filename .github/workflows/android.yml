name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Write google-services.json
      env:
        GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        echo "Secret length: ${#GOOGLE_SERVICES_JSON_B64}"
        echo "Secret first 20 chars: ${GOOGLE_SERVICES_JSON_B64:0:20}"
        echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
        echo "File first 20 chars: $(head -c 20 app/google-services.json)"
    - name: Build with Gradle
      run: ./gradlew assembleProdDebug
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: toolboox-prod-debug-latest.apk
        path: app/build/outputs/apk/prod/debug/toolboox-prod-debug-*.apk
